# fly.toml app configuration file generated for codespaces-mcp on 2026-08-16T09:38:49Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#
# STATUS (set by agent/hub-cicd, see coordination/status/hub-cicd.md):
# Render is the confirmed, supported, actually-deployed target — see
# render.yaml and ARCHITECTURE.md's "Deployment target" section.
# server.py DOES auto-detect FLY_APP_NAME (for MCP_ALLOWED_HOST) so this
# file would plausibly still work if someone deployed it to Fly, but
# nothing in this project's history confirms a Fly deployment is
# actually live, tested, or maintained — it appears to predate the
# switch to Render and was never removed. Kept as-is (not deleted)
# since deleting a working-if-unused config is a bigger, less reversible
# call than documenting its status; if Fly support is confirmed dead,
# removing this file is a safe follow-up.
#
app = 'codespaces-mcp'
primary_region = 'iad'
[build]
[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']
[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
