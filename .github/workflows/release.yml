name: Release

# Tag-triggered release pipeline: build the Windows PC agent, run the
# real CI suite, package everything up, and publish it all to a GitHub
# Release named after the tag.
#
# This is separate from build-organiser-agent.yml, which publishes a
# rolling "latest" build of just the .exe on every push to main. This
# workflow only runs for actual version tags (or a manual dispatch) and
# produces a versioned, immutable release with the server bundle + docs
# attached too — not just the agent binary.
#
# Testing (agent/hub-cicd): the "ci" job below calls
# .github/workflows/ci.yml as a reusable workflow (lint + the full pytest
# suite + compile-checks for organiser-agent.cpp and hub-diagnostics.py)
# instead of maintaining a separate test step here — see ci.yml's own
# header comment for why (this is exactly the gap this note used to flag
# before agent/hub-cicd's CI work landed).

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: >
          Tag to release (must already exist, e.g. v1.2.3). Only needed
          for a manual re-run; a real tag push fills this in automatically.
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-agent:
    name: Build organiser-agent.exe
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build organiser-agent.exe
        shell: cmd
        run: cl /EHsc /O2 /std:c++17 organiser-agent.cpp /Fe:organiser-agent.exe

      - name: Checksum
        shell: bash
        run: sha256sum organiser-agent.exe > organiser-agent.exe.sha256

      - name: Upload agent + checksum
        uses: actions/upload-artifact@v4
        with:
          name: organiser-agent-build
          path: |
            organiser-agent.exe
            organiser-agent.exe.sha256
          retention-days: 7

  ci:
    name: CI (lint + test + compile checks)
    # Calls .github/workflows/ci.yml's jobs as a reusable workflow rather
    # than maintaining a separate/divergent test step here -- this is
    # exactly what that workflow's own header comment (and this repo's
    # coordination/status/hub-cicd.md) says it exists to replace. Runs
    # the exact same lint+pytest+compile-check jobs against the exact
    # tagged commit this release build is for.
    uses: ./.github/workflows/ci.yml

  package-and-release:
    name: Package + publish release
    needs: [build-agent, ci]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download built agent
        uses: actions/download-artifact@v4
        with:
          name: organiser-agent-build
          path: dist/

      - name: Build release info + server bundle
        run: |
          set -e
          TAG="${{ steps.version.outputs.tag }}"
          SHA="${GITHUB_SHA}"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          cat > dist/RELEASE_INFO.txt <<EOF
          server-mcp-gemini release
          Version:    ${TAG}
          Commit:     ${SHA}
          Built:      ${DATE}
          Agent SHA256: $(cut -d' ' -f1 dist/organiser-agent.exe.sha256)
          EOF

          mkdir -p bundle
          cp server.py requirements.txt Dockerfile start.sh "pc-tunnel@.service" bundle/
          cp README.md ARCHITECTURE.md BUILD_AND_SETUP.md SKILL.md bundle/
          mkdir -p bundle/scripts
          cp scripts/install-organiser-agent.ps1 bundle/scripts/ 2>/dev/null || true
          cp dist/RELEASE_INFO.txt bundle/

          (cd bundle && zip -r "../server-mcp-gemini-${TAG}.zip" .)

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "server-mcp-gemini ${{ steps.version.outputs.tag }}"
          generate_release_notes: true
          body: |
            Automated release of server-mcp-gemini ${{ steps.version.outputs.tag }}
            (commit ${{ github.sha }}).

            **Assets:**
            - `organiser-agent.exe` + `organiser-agent.exe.sha256` — Windows PC
              agent. Install with `scripts/install-organiser-agent.ps1` (verifies
              the checksum for you), or manually per `BUILD_AND_SETUP.md`.
            - `server-mcp-gemini-${{ steps.version.outputs.tag }}.zip` — server.py,
              requirements.txt, Dockerfile/start.sh, pc-tunnel@.service, the
              installer script, and all docs (README/ARCHITECTURE/BUILD_AND_SETUP/
              SKILL) at this version.

            See `ARCHITECTURE.md` in the bundle for known limitations before
            deploying.
          files: |
            dist/organiser-agent.exe
            dist/organiser-agent.exe.sha256
            server-mcp-gemini-${{ steps.version.outputs.tag }}.zip
