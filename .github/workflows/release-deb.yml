name: Release .deb Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 0.3.1)'
        required: true
        default: '0.3.0'

jobs:
  build-deb:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          fi

      - name: Fix script permissions
        run: |
          chmod 755 packaging/mcp-hub-tools/DEBIAN/postinst
          chmod 755 packaging/mcp-hub-tools/DEBIAN/prerm
          chmod 755 packaging/mcp-hub-tools/DEBIAN/postrm

      - name: Install build deps
        run: sudo apt-get install -y dpkg-dev

      - name: Build .deb
        run: bash packaging/build-deb.sh ${{ steps.version.outputs.VERSION }}

      - name: Find built .deb
        id: deb
        run: |
          DEB=$(find packaging -maxdepth 1 -name "*.deb" | head -1)
          if [ -z "$DEB" ]; then
            echo "ERROR: No .deb file found in packaging/"
            find . -name "*.deb" 2>/dev/null || true
            exit 1
          fi
          echo "DEB_PATH=$DEB" >> $GITHUB_OUTPUT
          echo "DEB_NAME=$(basename $DEB)" >> $GITHUB_OUTPUT
          SHA=$(sha256sum $DEB | cut -d' ' -f1)
          echo "SHA256=$SHA" >> $GITHUB_OUTPUT
          echo "Found: $DEB (sha256: $SHA)"

      - name: Stamp version into install.sh
        run: |
          sed -i 's|VERSION="${1:-.*}"|VERSION="${1:-${{ steps.version.outputs.VERSION }}}"|' install.sh
          chmod +x install.sh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: mcp-hub-tools v${{ steps.version.outputs.VERSION }}
          body: |
            ## mcp-hub-tools v${{ steps.version.outputs.VERSION }}

            ### One-line install
            ```bash
            curl -fsSL https://github.com/SToni-Dev-Studio/server-mcp-gemini/releases/download/v${{ steps.version.outputs.VERSION }}/install.sh | sudo bash
            ```

            ### Whats included
            - hub-cli: manage PC tunnel config and Render env vars
            - hub-diagnostics: local health checks and connectivity tests
            - hub-monitor: PC self-registration listener + 5-min poll daemon
            - systemd units: hub-monitor.service, hub-poll.timer

            ### SHA256
            `${{ steps.deb.outputs.SHA256 }}`
          files: |
            ${{ steps.deb.outputs.DEB_PATH }}
            install.sh
          draft: false
          prerelease: false
